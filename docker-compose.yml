services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-tts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-ttsbot}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ttsbot_secure_password}
      POSTGRES_DB: ${PGDATABASE:-discord_tts}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ttsbot} -d ${PGDATABASE:-discord_tts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tts-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-auto-tts-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${PGUSER:-ttsbot}:${PGPASSWORD:-ttsbot_secure_password}@postgres:5432/${PGDATABASE:-discord_tts}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-ttsbot}
      PGPASSWORD: ${PGPASSWORD:-ttsbot_secure_password}
      PGDATABASE: ${PGDATABASE:-discord_tts}
      PGSSL: "false"
      PIPER_BIN_PATH: /usr/local/bin/piper/piper
      PIPER_MODELS_DIR: /app/models/piper
      TTS_TEMP_DIR: /app/tmp/tts
    volumes:
      - ./models/piper:/app/models/piper
      - tts_temp:/app/tmp/tts

volumes:
  postgres_data:
  tts_temp:
